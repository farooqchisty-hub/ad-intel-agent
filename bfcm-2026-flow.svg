<text x="64" y="870" font-size="24" font-weight="700" fill="#F0FF42" text-anchor="start">BFCM, free: the offer</text>
<text x="64" y="914" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">1  Your peak months, free</text>
<text x="64" y="940" font-size="15" font-weight="500" fill="#b9c4bf" text-anchor="start">2 months free on monthly, 5 on annual: the same discount, shown as months.</text>
<text x="64" y="970" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">2  Your BFCM ads, free</text>
<text x="64" y="996" font-size="15" font-weight="500" fill="#b9c4bf" text-anchor="start">Black Friday ads made from your own products, before you pay anything.</text>
<text x="64" y="1026" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">3  Free migration + priority human support</text>
<text x="64" y="1052" font-size="15" font-weight="500" fill="#b9c4bf" text-anchor="start">Moved from Klaviyo, Omnisend or Mailchimp for you; a person to call through Cyber Monday.</text>
<rect x="1060" y="826" width="500" height="250" rx="18" fill="#ffffff" stroke="#17201d" stroke-width="2"/>
<text x="1084" y="870" font-size="24" font-weight="700" fill="#17201d" text-anchor="start">Urgency, honestly</text>
<text x="1084" y="916" font-size="17" font-weight="500" fill="#3a4743" text-anchor="start">A real cap: the first 1,000 stores claim</text>
<text x="1084" y="944" font-size="17" font-weight="500" fill="#3a4743" text-anchor="start">the free months, with the true number left</text>
<text x="1084" y="972" font-size="17" font-weight="500" fill="#3a4743" text-anchor="start">shown on the page. One deadline: 1 Dec.</text>
<text x="1084" y="1000" font-size="17" font-weight="500" fill="#3a4743" text-anchor="start">No fake countdowns, no second offer.</text>
